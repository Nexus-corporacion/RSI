    function calculateEMA(prices, length) {
      const ema = new Array(prices.length).fill(0);
      if (prices.length === 0) return ema;
      const k = 2 / (length + 1);
      let sum = 0;
      const initLength = Math.min(length, prices.length);
      for (let i = 0; i < initLength; i++) {
        sum += prices[i];
      }
      let prevEma = sum / initLength;
      ema[initLength - 1] = prevEma;
      for (let i = initLength; i < prices.length; i++) {
        const currentEma = prices[i] * k + prevEma * (1 - k);
        ema[i] = currentEma;
        prevEma = currentEma;
      }
      for (let i = 0; i < initLength - 1; i++) {
        ema[i] = ema[initLength - 1];
      }
      return ema;
    }

    function calculateRSI(prices, length = 14) {
      const rsi = new Array(prices.length).fill(50);
      if (prices.length <= length) return rsi;

      const gains = [];
      const losses = [];
      for (let i = 1; i < prices.length; i++) {
        const diff = prices[i] - prices[i - 1];
        gains.push(diff > 0 ? diff : 0);
        losses.push(diff < 0 ? -diff : 0);
      }

      let avgGain = 0;
      let avgLoss = 0;
      for (let i = 0; i < length; i++) {
        avgGain += gains[i];
        avgLoss += losses[i];
      }
      avgGain /= length;
      avgLoss /= length;

      rsi[length] = avgLoss === 0 ? 100 : avgGain === 0 ? 0 : 100 - 100 / (1 + avgGain / avgLoss);

      for (let i = length + 1; i < prices.length; i++) {
        const g = gains[i - 1];
        const l = losses[i - 1];
        avgGain = (avgGain * (length - 1) + g) / length;
        avgLoss = (avgLoss * (length - 1) + l) / length;
        rsi[i] = avgLoss === 0 ? 100 : avgGain === 0 ? 0 : 100 - 100 / (1 + avgGain / avgLoss);
      }

      for (let i = 0; i < length; i++) {
        rsi[i] = rsi[length];
      }
      return rsi;
    }

    function Vh(symbol, timeframe, limit = 85) {
      const candles = [];
      const now = Date.now();
      let price = symbol === "BTCUSDT" ? 68000 : symbol === "ETHUSDT" ? 3804 : 1.5;
      const periodMs = timeframe === "5m" ? 300000 : timeframe === "15m" ? 900000 : timeframe === "1h" ? 3600000 : 14400000;
      
      for (let i = 0; i < limit; i++) {
        const time = now - (limit - i) * periodMs;
        const change = (Math.sin(i / 5) * 0.015) + ((Math.cos(i / 10) * 0.005));
        const open = price;
        const close = price * (1 + change);
        const high = Math.max(open, close) * 1.004;
        const low = Math.min(open, close) * 0.996;
        const volume = 100000 + Math.random() * 500000;
        const quoteVolume = volume * price;
        candles.push({ time, open, high, low, close, volume, quoteVolume });
        price = close;
      }
      return candles;
    }

    function analyzeChartData(
      candles,
      overboughtThreshold = 85,
      oversoldThreshold = 15,
      options = {}
    ) {
      const result = {
        rsi: [],
        ema50: [],
        ema200: [],
        supports: [],
        resistances: [],
        channelUpper: [],
        channelLower: [],
        marketStructure: [],
        trendLine: [],
        divergences: [],
        currentScore: 0,
        scoreBreakdown: {
          rsi: 0,
          divergence: 0,
          trend: 0,
          oi: 0,
          funding: 0,
          volume: 0,
          supRes: 0,
        },
        signals: [],
        close: candles[candles.length - 1]?.close || 0,
      };

      const len = candles.length;
      if (len < 5) return result;

      const closes = candles.map((c) => c.close);
      const highs = candles.map((c) => c.high);
      const lows = candles.map((c) => c.low);

      result.rsi = calculateRSI(closes, 14);
      result.ema50 = calculateEMA(closes, 50);
      result.ema200 = calculateEMA(closes, 200);

      // Donchian Channels
      const chLen = 20;
      result.channelUpper = new Array(len).fill(0);
      result.channelLower = new Array(len).fill(0);
      for (let i = 0; i < len; i++) {
        const start = Math.max(0, i - chLen + 1);
        const sliceHighs = highs.slice(start, i + 1);
        const sliceLows = lows.slice(start, i + 1);
        result.channelUpper[i] = Math.max(...sliceHighs);
        result.channelLower[i] = Math.min(...sliceLows);
      }

      // Pivot levels for S&R
      const localLows = [];
      const localHighs = [];
      for (let i = 2; i < len - 2; i++) {
        const h = highs[i];
        const l = lows[i];
        if (h > highs[i - 1] && h > highs[i - 2] && h > highs[i + 1] && h > highs[i + 2]) {
          localHighs.push(h);
        }
        if (l < lows[i - 1] && l < lows[i - 2] && l < lows[i + 1] && l < lows[i + 2]) {
          localLows.push(l);
        }
      }

      const groupLevels = (levels) => {
        const sorted = [...levels].sort((a, b) => a - b);
        const grouped = [];
        for (const val of sorted) {
          if (grouped.length === 0 || val - grouped[grouped.length - 1] > grouped[grouped.length - 1] * 0.005) {
            grouped.push(val);
          }
        }
        return grouped.slice(-4);
      };

      result.supports = groupLevels(localLows);
      result.resistances = groupLevels(localHighs);

      // Market structure high / lows
      let lastHH = 0;
      let lastLL = 0;
      for (let i = 2; i < len - 2; i++) {
        const h = highs[i];
        const l = lows[i];
        if (h > highs[i - 1] && h > highs[i - 2] && h > highs[i + 1] && h > highs[i + 2]) {
          if (lastHH !== 0) {
            const type = h > lastHH ? "HH" : "LH";
            result.marketStructure.push({ index: i, type, price: h });
          }
          lastHH = h;
        }
        if (l < lows[i - 1] && l < lows[i - 2] && l < lows[i + 1] && l < lows[i + 2]) {
          if (lastLL !== 0) {
            const type = l > lastLL ? "HL" : "LL";
            result.marketStructure.push({ index: i, type, price: l });
          }
          lastLL = l;
        }
      }

      // Divergences detector pre-calculations
      const ms = result.marketStructure;
      for (let i = 2; i < ms.length; i++) {
        const prev = ms[i - 2];
        const curr = ms[i];
        if (prev.type === "LL" && curr.type === "LL" && curr.index - prev.index < 35 && result.rsi[curr.index] > result.rsi[prev.index] + 1) {
          result.divergences.push({
            index: curr.index,
            type: "bullish",
            text: "Divergencia Alcista RSI",
          });
        }
        if (prev.type === "HH" && curr.type === "HH" && curr.index - prev.index < 35 && result.rsi[curr.index] < result.rsi[prev.index] - 1) {
          result.divergences.push({
            index: curr.index,
            type: "bearish",
            text: "Divergencia Bajista RSI",
          });
        }
      }

      // Trend line & State
      result.trendLine = new Array(len).fill(null).map((_, i) => {
        const ema50Val = result.ema50[i] || closes[i];
        const rsiVal = result.rsi[i] || 50;
        const price = closes[i];
        const dev = Math.abs(price - ema50Val) / ema50Val;
        const isBullDivergent = result.divergences.some(
          (d) => i - d.index >= 0 && i - d.index < 15 && d.type === "bullish"
        );
        const isBearDivergent = result.divergences.some(
          (d) => i - d.index >= 0 && i - d.index < 15 && d.type === "bearish"
        );

        let state = "neutral";
        if (dev < 0.0025) {
          state = "neutral";
        } else if (price > ema50Val) {
          state = rsiVal > 51 || isBullDivergent || rsiVal < 30 ? "bullish" : "neutral";
        } else {
          state = rsiVal < 49 || isBearDivergent || rsiVal > 70 ? "bearish" : "neutral";
        }

        return {
          price: ema50Val,
          isBullish: state === "bullish",
          state,
        };
      });

      const lastClose = closes[len - 1];
      const lastRSI = result.rsi[len - 1];
      const trendBullet = result.trendLine[len - 1].isBullish;

      // 1. Scoring - RSI Weight
      let rsiScore = 0;
      if (lastRSI <= oversoldThreshold) {
        rsiScore = 25;
        result.signals.push(`Oversold RSI (${lastRSI.toFixed(1)})`);
      } else if (lastRSI >= overboughtThreshold) {
        rsiScore = 25;
        result.signals.push(`Overbought RSI (${lastRSI.toFixed(1)})`);
      } else {
        const distance = Math.min(Math.abs(lastRSI - oversoldThreshold), Math.abs(lastRSI - overboughtThreshold));
        if (distance < 10) {
          rsiScore = Math.floor((10 - distance) * 2.5);
        }
      }
      result.scoreBreakdown.rsi = rsiScore;

      // 2. Scoring - Divergences Weight
      const hasRecentDiv = result.divergences.find((d) => len - 1 - d.index < 12);
      let divScore = 0;
      if (hasRecentDiv) {
        divScore = 20;
        result.signals.push(`Divergencia Detectada (${hasRecentDiv.type === "bullish" ? "LONG" : "SHORT"})`);
      }
      result.scoreBreakdown.divergence = divScore;

      // 3. Scoring - Trend align
      let trendScore = 0;
      const emaGolden = result.ema50[len - 1] > result.ema200[len - 1];
      if (trendBullet === emaGolden) {
        trendScore = 15;
      } else {
        trendScore = 5;
      }
      result.scoreBreakdown.trend = trendScore;

      // 4. Scoring - Open Interest Weight
      let oiScore = 0;
      const oiChg = options.openInterestChange ?? 0.05;
      if (Math.abs(oiChg) >= 0.03) {
        oiScore = 10;
        result.signals.push(`Open Interest Elevado (${(oiChg * 100).toFixed(1)}%)`);
      } else {
        oiScore = Math.floor(Math.abs(oiChg) * 330);
      }
      result.scoreBreakdown.oi = Math.min(10, oiScore);

      // 5. Scoring - Funding Rate
      let fundingScoreVal = 0;
      const fundingRateVal = options.fundingRate ?? 1e-4;
      const absFunding = Math.abs(fundingRateVal);
      if (absFunding >= 3e-4) {
        fundingScoreVal = 10;
        result.signals.push(`Funding Rate Extremo (${(fundingRateVal * 100).toFixed(4)}%)`);
      } else if (absFunding >= 1e-4) {
        fundingScoreVal = 6;
      } else {
        fundingScoreVal = 3;
      }
      result.scoreBreakdown.funding = fundingScoreVal;

      // 6. Scoring - Commercial Volume
      let volumeScoreVal = 0;
      const currentVolume = candles[len - 1]?.volume || 0;
      const recentVolumes = candles.slice(-20).map((c) => c.volume);
      const avgVolume = recentVolumes.reduce((acc, curr) => acc + curr, 0) / recentVolumes.length;
      if (currentVolume > avgVolume * 1.8) {
        volumeScoreVal = 10;
        result.signals.push("Pico de Volumen Comercial");
      } else if (currentVolume > avgVolume * 1.2) {
        volumeScoreVal = 6;
      } else {
        volumeScoreVal = 2;
      }
      result.scoreBreakdown.volume = volumeScoreVal;

      // 7. Scoring - Support / Resistance proximity
      let srProximityScore = 0;
      const isAtSupport = result.supports.some((s) => Math.abs(lastClose - s) / s < 0.003);
      const isAtResistance = result.resistances.some((r) => Math.abs(lastClose - r) / r < 0.003);
      if (isAtSupport || isAtResistance) {
        srProximityScore = 10;
        result.signals.push(`Toque de Zona Intradía (${isAtSupport ? "Soporte" : "Resistencia"})`);
      } else {
        const minSupportDistance = Math.min(...result.supports.map((s) => Math.abs(lastClose - s) / s));
        const minResistanceDistance = Math.min(...result.resistances.map((r) => Math.abs(lastClose - r) / r));
        const closestDist = Math.min(minSupportDistance, minResistanceDistance);
        if (closestDist < 0.01) {
          srProximityScore = Math.floor((0.01 - closestDist) * 1000);
        }
      }
      result.scoreBreakdown.supRes = Math.min(10, srProximityScore);

      // Total calculate
      result.currentScore =
        result.scoreBreakdown.rsi +
        result.scoreBreakdown.divergence +
        result.scoreBreakdown.trend +
        result.scoreBreakdown.oi +
        result.scoreBreakdown.funding +
        result.scoreBreakdown.volume +
        result.scoreBreakdown.supRes;

      return result;
    }

    const BINANCE_PROXIES = [
      "https://fapi.binance.com",
      "https://api1.binance.com",
      "https://api2.binance.com",

    let currentProxyIndex = 0;

    async function fetchFromBinance(path) {
      let lastError = null;
      for (let i = 0; i < BINANCE_PROXIES.length; i++) {
        const base = BINANCE_PROXIES[(currentProxyIndex + i) % BINANCE_PROXIES.length];
        const url = `${base}${path}`;
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 6000);
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(timeoutId);
          if (res.ok) {
            currentProxyIndex = (currentProxyIndex + i) % BINANCE_PROXIES.length;
            return await res.json();
          }
        } catch (e) {
          lastError = e;
        }
      }
      throw lastError || new Error("Failed to fetch from all Binance API pools.");
    }

    class AudioFeedbackEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      initCtx() {
        if (!this.ctx && typeof window !== "undefined") {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume().catch((e) => console.warn(e));
        }
      }

      playSuave() {
        try {
          if (!this.enabled) return;
          this.initCtx();
          if (!this.ctx) return;
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(587.33, t);
          osc.frequency.exponentialRampToValueAtTime(880, t + 0.3);
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.2, t + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.6);
        } catch (e) {
          console.warn("Audio Synthesis suave failed", e);
        }
      }

      playFuerte() {
        try {
          if (!this.enabled) return;
          this.initCtx();
          if (!this.ctx) return;
          const t = this.ctx.currentTime;
          [0, 0.18].forEach((delay) => {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(1200, t + delay);
            gain.gain.setValueAtTime(0, t + delay);
            gain.gain.linearRampToValueAtTime(0.35, t + delay + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.16);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t + delay);
            osc.stop(t + delay + 0.2);
          });
        } catch (e) {
          console.warn("Audio Synthesis fuerte failed", e);
        }
      }

      playCritica() {
        try {
          if (!this.enabled) return;
          this.initCtx();
          if (!this.ctx) return;
          const t = this.ctx.currentTime;
          [0, 0.15, 0.3].forEach((delay, idx) => {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(1500 - idx * 100, t + delay);
            gain.gain.setValueAtTime(0, t + delay);
            gain.gain.linearRampToValueAtTime(0.4, t + delay + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t + delay);
            osc.stop(t + delay + 0.15);
          });
        } catch (e) {
          console.warn("Audio Synthesis critica failed", e);
        }
      }
    }

    function TradingViewWidget({ symbol, timeframe, candles, analysis }) {
      const tvInterval =
        timeframe === "5m" ? "5" : timeframe === "15m" ? "15" : timeframe === "1h" ? "60" : "240";
      const tvUrl = `https://s.tradingview.com/widgetembed/?symbol=BINANCE:${symbol.toUpperCase()}&interval=${tvInterval}&theme=dark&style=1&timezone=Etc%2FUTC&locale=es`;

      // Calculations for actual structural Support and Resistance Lines
      const currentPrice = candles.length > 0 ? candles[candles.length - 1].close : 0;
      const candleHighs = candles.map((c) => c.high);
      const candleLows = candles.map((c) => c.low);

      const maxDisplayPrice = candleHighs.length > 0 ? Math.max(...candleHighs) : currentPrice > 0 ? currentPrice * 1.05 : 100;
      const minDisplayPrice = candleLows.length > 0 ? Math.min(...candleLows) : currentPrice > 0 ? currentPrice * 0.95 : 0;
      const priceRange = maxDisplayPrice - minDisplayPrice;

      // Extract closest support and resistance values
      const supportValue =
        analysis?.supports && analysis.supports.length > 0
          ? [...analysis.supports].reverse().find((s) => s < currentPrice) || analysis.supports[analysis.supports.length - 1]
          : null;

      const resistanceValue =
        analysis?.resistances && analysis.resistances.length > 0
          ? analysis.resistances.find((r) => r > currentPrice) || analysis.resistances[0]
          : null;

      // Map value nicely between 10% and 90% space of container height to avoid clipping
      const calcPercent = (val) => {
        if (!val || priceRange === 0) return null;
        const rawPct = ((val - minDisplayPrice) / priceRange) * 100;
        return Math.max(10, Math.min(90, rawPct));
      };

      const supportPct = calcPercent(supportValue);
      const resistancePct = calcPercent(resistanceValue);

      return (
        <div className="flex flex-col h-full bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden relative shadow-inner">

                PINE SCRIPT: SUPERTREND & EMA
              </span>
            </div>
          </div>

          <div className="flex-1 w-full bg-slate-955 min-h-[300px] relative">
            <iframe
              id="tv-widget-iframe"
              title={`TradingView Chart for ${symbol}`}
              src={tvUrl}
              className="w-full h-full border-0 absolute inset-0 z-0"
              allowFullScreen
            />

            {/* Overlay: Real Support & Resistance Lines */}
            {resistanceValue && resistancePct !== null && (
              <div
                className="absolute left-0 right-0 border-t-2 border-dashed border-rose-500/80 z-10 pointer-events-none flex items-center justify-end"
                style={{ top: `${(100 - resistancePct).toFixed(2)}%` }}

                  RESISTENCIA PRINCIPAL: ${resistanceValue.toLocaleString(undefined, { minimumFractionDigits: 2 })}
                </div>
              </div>
            )}

            {supportValue && supportPct !== null && (
              <div

        return () => clearInterval(interval);

            console.error(err);

      const playTest = (level) => {

      const curvePath = (() => {
        const power = Math.abs(rsiHeading - 50) / 50 * 18 + 7;
        const coords = [];
        let seedVal = activeSymbol.split("").reduce((sum, char) => sum + char.charCodeAt(0), 0) + tickerOffset;

          const x = Math.sin(seedVal++) * 10000;

        for (let i = 0; i <= 7; i++) {

          const cy = 48 - nextRandom() * power;
          coords.push({ x: cx, y: cy });
        }

        let dStr = `M0,60 L0,${coords[0].y.toFixed(1)} `;
        for (let i = 0; i < coords.length - 1; i++) {

          dStr += `Q${p1.x.toFixed(1)},${p1.y.toFixed(1)} ${mx.toFixed(1)},${((p1.y + p2.y) / 2).toFixed(1)} `;
        }

        const last = coords[coords.length - 1];
        dStr += `Q${last.x.toFixed(1)},${last.y.toFixed(1)} 320,48 L320,60 Z`;
        return dStr;

        try {
          // Fetch Bitget symbols
          let bitgetSymbols = new Set(FALLBACK_BITGET_USDTM);
          let bitgetSuccess = false;
          try {
            const response = await fetch(
              "https://api.bitget.com/api/v2/mix/market/symbols?productType=USDT-FUTURES",
              { mode: "cors" }
            );
            if (response.ok) {
              const json = await response.json();
              if (json && json.data && json.data.length > 0) {
                bitgetSymbols = new Set();
                json.data.forEach((item) => {
                  const name = (item.symbolName || item.symbol || "").toUpperCase();
                  const norm = name.replace("_UMCBL", "").replace("_DMCBL", "");
                  if (norm.endsWith("USDT")) {
                    bitgetSymbols.add(norm);
                  }
                });
                bitgetSuccess = true;
              }
            }
          } catch (err) {
            console.warn("Could not load Bitget Futures USDT-M list, falling back to cached catalog:", err);
          }

          // Fetch Coingecko market caps
          let marketCapMap = new Map();
          Object.entries(FALLBACK_COINS_MCAP).forEach(([k, v]) => marketCapMap.set(k, v));
          let coingeckoSuccess = false;
          try {
            for (let page = 1; page <= 4; page++) {
              const res = await fetch(
                `https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=${page}`,
                { mode: "cors" }
              );
              if (res.ok) {
                const list = await res.json();
                if (Array.isArray(list)) {
                  list.forEach((coin) => {
                    if (coin.symbol) {
                      const sym = coin.symbol.toUpperCase() + "USDT";
                      marketCapMap.set(sym, coin.market_cap || 0);
                    }
                  });
                  coingeckoSuccess = true;
                }
              } else {
                break;
              }
            }
          } catch (err) {
            console.warn("Could not load CoinGecko market caps, falling back to cached catalog:", err);
          }

          const activeFilters = {
            bitgetSymbols,
            marketCapMap,
            bitgetSuccess: bitgetSuccess || bitgetSymbols.size > 0,
            coingeckoSuccess: coingeckoSuccess || marketCapMap.size > 0,
          };
          setFilters(activeFilters);

          // Load 24h Binance Tickers
          let liveTickers = [];
          try {
            const binTickers = await fetchFromBinance("/fapi/v1/ticker/24hr");
            if (binTickers && Array.isArray(binTickers)) {
              let fundRates = {};
              try {
                const indices = await fetchFromBinance("/fapi/v1/premiumIndex");
                if (Array.isArray(indices)) {
                  indices.forEach((ind) => {
                    if (ind.symbol && ind.lastFundingRate) {
                      fundRates[ind.symbol] = parseFloat(ind.lastFundingRate);
                    }
                  });
                }
              } catch {}

              liveTickers = binTickers
                .filter((item) => item.symbol && item.symbol.endsWith("USDT"))
                .map((item) => {
                  const sym = item.symbol;
                  const price = parseFloat(item.lastPrice || item.price || "0");
                  const change = parseFloat(item.priceChangePercent || "0");
                  const high = parseFloat(item.highPrice || "0");
                  const low = parseFloat(item.lowPrice || "0");
                  const vol = parseFloat(item.quoteVolume || "0");
                  const rate = fundRates[sym] !== undefined ? fundRates[sym] : 0.0001;
                  const oi = vol * 0.2;
                  return {
                    symbol: sym,
                    price: isNaN(price) ? 0 : price,
                    change24h: isNaN(change) ? 0 : change,
                    high24h: high || price * 1.02,
                    low24h: low || price * 0.98,
                    volume24h: vol,
                    fundingRate: rate,
                    openInterest: oi,
                  };
                });
            }
          } catch (e) {
            console.warn("Failed fetching live Binance tickers:", e);
          }

          if (liveTickers.length === 0) {
            liveTickers = FALLBACK_TICKERS.map((t) => ({
              symbol: t.s,
              price: t.p,
              change24h: t.c,
              high24h: t.p * 1.025,
              low24h: t.p * 0.975,
              volume24h: t.v,
              fundingRate: t.f,
              openInterest: t.oi,
            }));
            setApiState("FALLBACK_SIM");
          } else {
            setApiState("ONLINE");
          }

          const filteredLiveList = liveTickers.filter((item) => {
            const sym = item.symbol;
            if (
              sym.includes("UPUSDT") ||
              sym.includes("DOWNUSDT") ||
              sym.includes("BULLUSDT") ||
              sym.includes("BEARUSDT") ||
              sym.length > 15
            ) {
              return false;
            }

            // Bitget USDT-M Futures verification
            if (activeFilters.bitgetSuccess && !activeFilters.bitgetSymbols.has(sym)) {
              return false;
            }

            // Minimum $2,000,000 USD Market Cap verification
            if (activeFilters.coingeckoSuccess) {
              const cap = activeFilters.marketCapMap.get(sym);
              const capValue = cap !== undefined ? cap : 0;
              if (capValue < 2000000) {
                return false;
              }
            }

            return true;
          });

          const finalContracts =
            filteredLiveList.length > 0
              ? filteredLiveList.sort((a, b) => b.volume24h - a.volume24h)
              : liveTickers;

          setContractsList(finalContracts);

          const initialMap = {};
          finalContracts.forEach((item) => {
            initialMap[item.symbol] = {
              ...item,
              rsi: 50,
              score: 0,
              trend: "Neutral",
              lastScanned: 0,
              signals: [],
            };
          });

          setMonitoredAssets((prev) => {
            const next = { ...initialMap };
            Object.keys(prev).forEach((key) => {
              if (next[key]) {
                next[key] = {
                  ...next[key],
                  rsi: prev[key].rsi,
                  score: prev[key].score,
                  trend: prev[key].trend,
                  lastScanned: prev[key].lastScanned,
                  signals: prev[key].signals,
                  analysis: prev[key].analysis,
                };
              }
            });
            return next;
          });

          // Quick seed initial key assets
          const coreTokens = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "DOGEUSDT", "PEPEUSDT", "AVAXUSDT"];
          setTimeout(() => {
            coreTokens.forEach(async (sym) => {
              const activeTicker = finalContracts.find((t) => t.symbol === sym);
              if (activeTicker) {
                await performBackgroundKlineScan(activeTicker, false);
              }
            });
          }, 100);

        } catch (err) {
          console.error("Critical loader failed", err);
          const fallbackList = FALLBACK_TICKERS.map((t) => ({
            symbol: t.s,
            price: t.p,
            change24h: t.c,
            high24h: t.p * 1.025,
            low24h: t.p * 0.975,
            volume24h: t.v,
            fundingRate: t.f,
            openInterest: t.oi,
          }));
          setContractsList(fallbackList);
        }
      };

      // Background scanned assets loop
      const scanNextAsset = async () => {
        if (contractsList.length === 0) return;
        const index = scanPointerRef.current % contractsList.length;
        const asset = contractsList[index];
        scanPointerRef.current++;

        await performBackgroundKlineScan(asset, true);
      };

      const performBackgroundKlineScan = async (ticker, triggerAlerts) => {
        try {
          let klines = [];
          try {
            const path = `/fapi/v1/klines?symbol=${ticker.symbol}&interval=${timeframe}&limit=85`;
            const json = await fetchFromBinance(path);
            if (Array.isArray(json)) {
              klines = json.map((u) => ({
                time: parseInt(u[0]),
                open: parseFloat(u[1]),
                high: parseFloat(u[2]),
                low: parseFloat(u[3]),
                close: parseFloat(u[4]),
                volume: parseFloat(u[5]),
                quoteVolume: parseFloat(u[7] || "0"),
              }));
              klines.sort((a, b) => a.time - b.time);
            }
          } catch {
            klines = Vh(ticker.symbol, timeframe, 85);
          }

          if (klines.length > 5) {
            const analysis = analyzeChartData(klines, rsiOB, rsiOS, {
              fundingRate: ticker.fundingRate,
              openInterestChange: 0.04,
            });
            const currentRsi = analysis.rsi[analysis.rsi.length - 1];
            const score = analysis.currentScore;

            setMonitoredAssets((prev) => {
              const original = prev[ticker.symbol] || {
                symbol: ticker.symbol,
                price: ticker.price,
                change24h: ticker.change24h,
                high24h: ticker.high24h,
                low24h: ticker.low24h,
                volume24h: ticker.volume24h,
                fundingRate: ticker.fundingRate,
                openInterest: ticker.openInterest,
                rsi: 50,
                score: 0,
                trend: "Neutral",
                lastScanned: 0,
                signals: [],
              };
              return {
                ...prev,
                [ticker.symbol]: {
                  ...original,
                  rsi: currentRsi,
                  score: score,
                  trend: (() => {
                    const state = analysis.trendLine[analysis.trendLine.length - 1]?.state;
                    return state === "bullish" ? "Alcista" : state === "bearish" ? "Bajista" : "Neutral";
                  })(),
                  lastScanned: Date.now(),
                  signals: analysis.signals,
                  analysis: analysis,
                },
              };
            });

            if (triggerAlerts) {
              evaluateAndDisparateAlerts(ticker.symbol, klines[klines.length - 1].close, currentRsi, score);
            }
          }
        } catch (err) {
          console.warn("Scan failed for:", ticker.symbol, err);
        }
      };

      const evaluateAndDisparateAlerts = (
        symbol,
        price,
        rsi,
        score
      ) => {
        const isOversold = rsi <= rsiOS;
        const isOverbought = rsi >= rsiOB;
        const isSniper = score >= 90;

        let alertType = "";
        let alertMsg = "";

        if (isSniper) {
          alertType = rsi <= 20 ? "SNIPER_LONG" : "SNIPER_SHORT";
          alertMsg = rsi <= 20 ? "Sniper LONG Extremo" : "Sniper SHORT Extremo";
        } else if (isOversold) {
          alertType = "LONG";
          alertMsg = "Soporte Long Confirmado";
        } else if (isOverbought) {
          alertType = "SHORT";
          alertMsg = "Resistencia Short Confirmada";
        }

        if (alertType) {
          setAlerts((prev) => {
            const alreadyRecent = prev.find((al) => al.symbol === symbol && Date.now() - al.time < 60000);
            if (alreadyRecent) return prev;

            if (isSniper) audioPlayer.playCritica();
            else if (isOversold) audioPlayer.playSuave();
            else if (isOverbought) audioPlayer.playFuerte();

            return [
              {
                id: `${symbol}_${Date.now()}`,
                time: Date.now(),
                symbol,
                price,
                rsi,
                score,
                type: alertType,
                msg: alertMsg,
              },
              ...prev,
            ].slice(0, 50);
          });
        }
      };

      const loadActiveSymbolDetails = async (symbol) => {
        try {
          let klines = [];
          try {
            const path = `/fapi/v1/klines?symbol=${symbol}&interval=${timeframe}&limit=85`;
            const json = await fetchFromBinance(path);
            if (Array.isArray(json)) {
              klines = json.map((u) => ({
                time: parseInt(u[0]),
                open: parseFloat(u[1]),
                high: parseFloat(u[2]),
                low: parseFloat(u[3]),
                close: parseFloat(u[4]),
                volume: parseFloat(u[5]),
                quoteVolume: parseFloat(u[7] || "0"),
              }));
              klines.sort((a, b) => a.time - b.time);
            }
          } catch {
            klines = Vh(symbol, timeframe, 85);
          }

          setActiveCandles(klines);

          if (klines.length > 0) {
            const analysis = analyzeChartData(klines, rsiOB, rsiOS, {
              fundingRate: contractsList.find((c) => c.symbol === symbol)?.fundingRate || 0.0001,
              openInterestChange: 0.04,
            });
            setActiveAnalysis(analysis);
          }

          const tfs = ["5m", "15m", "1h", "4h"];
          const mtResults = {};
          for (const tf of tfs) {
            try {
              let dataset = [];
              try {
                const rawKlines = await fetchFromBinance(`/fapi/v1/klines?symbol=${symbol}&interval=${tf}&limit=40`);
                if (Array.isArray(rawKlines)) {
                  dataset = rawKlines.map((u) => ({
                    time: parseInt(u[0]),
                    open: parseFloat(u[1]),
                    high: parseFloat(u[2]),
                    low: parseFloat(u[3]),
                    close: parseFloat(u[4]),
                    volume: parseFloat(u[5]),
                    quoteVolume: parseFloat(u[7] || "0"),
                  }));
                  dataset.sort((a, b) => a.time - b.time);
                }
              } catch {
                dataset = Vh(symbol, tf, 40);
              }

              if (dataset.length > 5) {
                const an = analyzeChartData(dataset, rsiOB, rsiOS);
                const rVal = an.rsi[an.rsi.length - 1];
                const state = an.trendLine[an.trendLine.length - 1]?.state;
                mtResults[tf] = {
                  close: dataset[dataset.length - 1].close,
                  rsi: rVal,
                  trend: state === "bullish" ? "Alcista" : state === "bearish" ? "Bajista" : "Neutral",
                };
              }
            } catch {
              mtResults[tf] = { close: 0, rsi: 50, trend: "Neutral" };
            }
          }
          setActiveTfMetrics(mtResults);
        } catch (err) {
          console.error(err);
        }
      };

      useEffect(() => {
        loadFiltersAndTickers();
        primaryIntervalRef.current = setInterval(loadFiltersAndTickers, 45000);
        return () => {
          if (primaryIntervalRef.current) clearInterval(primaryIntervalRef.current);
        };
      }, []);

      useEffect(() => {
        if (scanLoopIntervalRef.current) clearInterval(scanLoopIntervalRef.current);
        if (bgScanning && contractsList.length > 0) {
          scanLoopIntervalRef.current = setInterval(() => {
            scanNextAsset();
          }, 850);
        }
        return () => {
          if (scanLoopIntervalRef.current) clearInterval(scanLoopIntervalRef.current);
        };
      }, [bgScanning, contractsList, timeframe, rsiOB, rsiOS]);

      useEffect(() => {
        loadActiveSymbolDetails(activeSymbol);
      }, [activeSymbol, timeframe, rsiOB, rsiOS]);

      useEffect(() => {
        const assets = Object.values(monitoredAssets);
        if (assets.length === 0) return;
        const scanned = assets.filter((a) => a.lastScanned > 0);
        setScanTickerCount(Math.round(scanned.length / 5));
      }, [monitoredAssets]);

      // Click Copy to Clipboard handler
      const handleTickerCardClick = (symbol) => {
        setActiveSymbol(symbol);
        navigator.clipboard.writeText(symbol);

        setCopiedTicker(symbol);
        setTimeout(() => {
          setCopiedTicker((prev) => (prev === symbol ? null : prev));
        }, 1800);
      };

      // Extreme opportunities filter reorder
      const extremeScannedAssets = Object.values(monitoredAssets)
        .filter((asset) => {
          const rVal = asset.rsi;
          if (typeof rVal !== "number" || isNaN(rVal) || asset.lastScanned === 0) return false;
          return rVal >= 85 || rVal <= 15;
        })
        .sort((a, b) => {
          return Math.abs(b.rsi - 50) - Math.abs(a.rsi - 50);
        })
        .slice(0, 6);

      const isSearchActive = searchFilter.trim().length > 0;
      const displayedAssetsList = isSearchActive
        ? Object.values(monitoredAssets)
            .filter((asset) => asset.symbol.toLowerCase().includes(searchFilter.trim().toLowerCase()))
            .sort((a, b) => b.score - a.score)
        : extremeScannedAssets;

      const activeTickerData = contractsList.find((c) => c.symbol === activeSymbol);
      const activeTickerPrice = activeTickerData ? activeTickerData.price : 0;

      const scannedTickersMap = Object.values(monitoredAssets);
      const activeScanned = scannedTickersMap.filter((a) => a.lastScanned > 0);
      const buySignalsCount = activeScanned.filter((a) => a.rsi <= rsiOS).length;
      const sellSignalsCount = activeScanned.filter((a) => a.rsi >= rsiOB).length;
      const scannedCount = activeScanned.length;

      const buyPct = scannedCount > 0 ? Math.round((buySignalsCount / scannedCount) * 100) : 50;
      const sellPct = scannedCount > 0 ? Math.round((sellSignalsCount / scannedCount) * 100) : 50;

      const topScoreRanking = Object.values(monitoredAssets)
        .filter((a) => a.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 3);

      const institutionalConsensus = (() => {
        const list = Object.values(activeTfMetrics);
        if (list.length === 0) return { label: "ZONA DE TRANSICIÓN", color: "text-slate-400 border-slate-800 bg-slate-900/10" };
        let ups = 0;
        let downs = 0;
        list.forEach((m) => {
          if (m.trend === "Alcista") ups++;
          else if (m.trend === "Bajista") downs++;
        });

        if (ups >= 3) {
          return {
            label: "FUERTE ALCISTA",
            color: "text-emerald-400 border-emerald-800/60 bg-emerald-950/20 shadow-[0_0_15px_rgba(16,185,129,0.15)] animate-pulse",
          };
        } else if (downs >= 3) {
          return {
            label: "FUERTE BAJISTA",
            color: "text-rose-400 border-rose-800/60 bg-rose-955/20 shadow-[0_0_15px_rgba(244,63,94,0.15)] animate-pulse",
          };
        } else {
          return {
            label: "VÓRTICE NEUTRAL",
            color: "text-amber-400 border-amber-805/40 bg-amber-955/10",
          };
        }
      })();

      return (
        <div
          id="scanner-cyberpunk-root"
          className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-cyan-500 selection:text-slate-900 overflow-x-hidden relative"
        >
          <span className="absolute top-0 left-1/4 w-[1px] h-[500px] bg-gradient-to-b from-blue-500/10 to-transparent pointer-events-none" />
          <span className="absolute top-0 right-1/4 w-[1px] h-[500px] bg-gradient-to-b from-purple-500/10 to-transparent pointer-events-none" />

          {copiedTicker && (
            <div
              className="fixed bottom-6 right-6 z-50 bg-emerald-955 border-2 border-emerald-500 text-emerald-400 rounded-xl px-5 py-3 shadow-[0_0_20px_rgba(16,185,129,0.4)] backdrop-blur-md animate-bounce flex items-center gap-2 select-none"
              id="copy-toast"
            >
              <CircleCheck className="text-emerald-400" size={16} />
              <span className="font-mono text-xs font-black uppercase tracking-widest">
                {copiedTicker} COPIADO!
              </span>
            </div>
          )}

          <header className="border-b border-slate-900 bg-slate-950/95 sticky top-0 z-30 backdrop-blur-md px-4 py-3 sm:px-6">
            <div className="max-w-full xl:px-4 mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-y-3">
              <div className="flex items-center gap-2.5">
                <div className="relative">
                  <span className="absolute -inset-1 rounded-lg bg-gradient-to-r from-cyan-400 to-purple-600 blur opacity-60 animate-pulse" />
                  <div className="relative bg-slate-950 p-1.5 rounded-lg border border-cyan-500/85">
                    <Activity className="text-cyan-400 animate-spin" size={16} />
                  </div>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-cyan-450">
                      FUTURES QUANT SCANNER v.0
                    </h1>
                  </div>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                <div className="flex items-center gap-1.5 bg-slate-900 border border-slate-850 px-2.5 py-1 rounded-xl">
                  <span className="text-xs font-mono text-rose-400 uppercase tracking-tight font-bold">RSI Alto:</span>
                  <input
                    id="input-ob-rsi"
                    type="number"
                    min="70"
                    max="95"
                    value={rsiOB}
                    onChange={(e) => setRsiOB(Math.max(70, Math.min(95, parseInt(e.target.value) || 85)))}
                    className="w-12 text-center bg-slate-950 border border-slate-800 text-rose-400 font-extrabold font-mono text-xs p-0.5 rounded-md focus:outline-none"
                  />
                </div>

                <div className="flex items-center gap-1.5 bg-slate-905 border border-slate-850 px-2.5 py-1 rounded-xl">
                  <span className="text-xs font-mono text-emerald-400 uppercase tracking-tight font-bold">RSI Bajo:</span>
                  <input
                    id="input-os-rsi"
                    type="number"
                    min="5"
                    max="30"
                    value={rsiOS}
                    onChange={(e) => setRsiOS(Math.max(5, Math.min(30, parseInt(e.target.value) || 15)))}
                    className="w-12 text-center bg-slate-950 border border-slate-800 text-emerald-400 font-extrabold font-mono text-xs p-0.5 rounded-md focus:outline-none"
                  />
                </div>

                <div className="flex bg-slate-900 border border-slate-850 rounded-xl p-0.5">
                  {["5m", "15m", "1h", "4h"].map((tf) => (
                    <button
                      key={tf}
                      id={`btn-tf-${tf}`}
                      onClick={() => setTimeframe(tf)}
                      className={`px-3 py-1 font-mono text-[11px] font-extrabold rounded-lg transition-all cursor-pointer ${
                        timeframe === tf
                          ? "bg-cyan-500 text-slate-950 shadow-[0_0_15px_rgba(6,182,212,0.6)]"
                          : "text-slate-400 hover:text-white hover:bg-slate-800/50"
                      }`}
                      type="button"
                    >
                      {tf}
                    </button>
                  ))}
                </div>

                <button
                  id="btn-scan-loop-toggle"
                  onClick={() => setBgScanning(!bgScanning)}
                  className={`px-3 py-1 border rounded-xl flex items-center gap-2 transition-all cursor-pointer font-mono text-[11px] font-bold leading-none ${
                    bgScanning
                      ? "bg-emerald-955/45 border-emerald-800 text-emerald-400"
                      : "bg-rose-955 border-rose-800 text-rose-400 shadow-[0_0_12px_rgba(244,63,94,0.2)]"
                  }`}
                  type="button"
                >
                  <span
                    className={`w-1.5 h-1.5 rounded-full ${
                      bgScanning ? "bg-emerald-400 animate-ping shadow-[0_0_8px_#34d399]" : "bg-rose-500"
                    }`}
                  />
                  <span>{bgScanning ? "SCANNER COMPILANDO" : "DETENIDO"}</span>
                </button>
              </div>
            </div>
          </header>

          <section className="bg-slate-950/80 px-4 py-2 border-b border-slate-900/60 backdrop-blur-sm">
            <div className="max-w-full xl:px-4 mx-auto grid grid-cols-2 md:grid-cols-5 gap-3">
              <div className="bg-slate-900/35 border border-slate-900 p-2.5 rounded-xl flex flex-col justify-between shadow-md">
                <span className="text-[10px] uppercase font-mono text-slate-400 font-bold tracking-wider">
                  CONTRATOS FILTRADOS
                </span>
                <div className="flex items-baseline gap-1.5 mt-1">
                  <span className="text-2xl font-black text-white">{contractsList.length}</span>
                  <span className="text-[10px] font-mono text-emerald-400 font-bold">USDT</span>
                </div>
                <span className="text-[9px] font-mono text-slate-500 mt-0.5 uppercase font-bold">
                  Bitget Futures USDT-M (&ge;$2M Cap)
                </span>
              </div>

              <div className="bg-slate-900/35 border border-slate-900 p-2.5 rounded-xl flex flex-col justify-between shadow-md">
                <span className="text-[10px] uppercase font-mono text-slate-400 font-bold tracking-wider">
                  SEÑALADA EXTRANJERA
                </span>
                <div className="flex items-baseline gap-1.5 mt-1">
                  <span className="text-2xl font-black text-cyan-400">{buySignalsCount + sellSignalsCount}</span>
                  <span className="text-[10px] font-mono text-slate-400">en {timeframe}</span>
                </div>
                <span className="text-[9px] font-mono text-cyan-500 mt-0.5 uppercase font-bold">
                  RSI Extremo detectado
                </span>
              </div>

              <div className="bg-slate-905/35 border border-slate-900 p-2.5 rounded-xl flex flex-col justify-between shadow-md">
                <span className="text-[10px] uppercase font-mono text-slate-400 font-bold tracking-wider">
                  CONSENSO EXTREMO
                </span>
                <div className="flex items-center gap-2 mt-1.5">
                  <div className="flex-1 bg-slate-800 h-2 rounded-full overflow-hidden flex border border-slate-900">
                    <span className="bg-emerald-500 h-full" style={{ width: `${buyPct}%` }} />
                    <span className="bg-rose-500 h-full" style={{ width: `${sellPct}%` }} />
                  </div>
                </div>
                <div className="flex justify-between items-center text-[9px] font-mono text-slate-350 mt-1 font-bold uppercase">
                  <span className="text-emerald-400">COMPRA: {buyPct}%</span>
                  <span className="text-rose-400">VENTA: {sellPct}%</span>
                </div>
              </div>

              <div className="bg-slate-900/35 border border-slate-900 p-2.5 rounded-xl flex flex-col justify-between shadow-md">
                <span className="text-[10px] uppercase font-mono text-slate-400 font-bold tracking-wider">
                  TOP MONEDAS SCORING
                </span>
                {topScoreRanking.length > 0 ? (
                  <div className="flex flex-col gap-0.5 mt-0.5 info-block font-mono text-[9.5px]">
                    {topScoreRanking.map((item) => (
                      <div className="flex justify-between items-center" key={item.symbol}>
                        <span className="text-slate-200 font-extrabold">{item.symbol.replace("USDT", "")}</span>
                        <span className="text-amber-400 font-black">{item.score} PTS</span>
                      </div>
                    ))}
                  </div>
                ) : (
                  <span className="text-[10px] text-slate-500 mt-1 font-mono">Rankings...</span>
                )}
              </div>

              <div className="bg-slate-900/35 border border-slate-900 p-2.5 rounded-xl flex flex-col justify-between shadow-md col-span-2 md:col-span-1">
                <span className="text-[10px] uppercase font-mono text-slate-400 font-bold tracking-wider">ESTADO DE API</span>
                <div className="flex items-baseline md:justify-start justify-end gap-1.5 mt-1">
                  <span className="w-2 h-2 rounded-full bg-emerald-400" />
                  <span className="text-xs font-black text-slate-100 uppercase tracking-wide">API DIRECTA</span>
                </div>
                <span className="text-[9px] font-mono text-slate-500 mt-0.5 uppercase">CONEXIÓN SSL MULTI-ORIGEN</span>
              </div>
            </div>
          </section>

          <main className="flex-grow max-w-full w-full mx-auto p-4 xl:px-6 grid grid-cols-1 xl:grid-cols-12 gap-4">
            {/* Left Sidebar: OPORTUNIDADES EXTREMAS */}
            <div className="xl:col-span-3 bg-slate-950/90 border border-slate-800 rounded-2xl p-3 backdrop-blur-md flex flex-col h-[490px] xl:h-[490px] shadow-2xl relative overflow-hidden">
              <div className="flex items-center justify-between border-b border-slate-950 pb-3 mb-3">
                <div className="flex items-center gap-2">
                  <SlidersHorizontal className="text-cyan-400" size={17} />
                  <span className="text-xs font-extrabold text-white uppercase tracking-wider">OPORTUNIDADES EXTREMAS</span>
                </div>
                <span className="text-[10px] font-mono text-slate-500 uppercase tracking-wider font-bold">RSI SCAN</span>
              </div>

              <div className="relative mb-4">
                <input
                  id="search-ranking-input"
                  type="text"
                  placeholder="Filtro de símbolo (e.g., BTC)..."
                  value={searchFilter}
                  onChange={(e) => setSearchFilter(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-800 text-xs font-mono text-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-1 focus:ring-cyan-500 placeholder-slate-600 block"
                />
                {searchFilter && (
                  <button
                    onClick={() => setSearchFilter("")}
                    className="absolute right-3 top-2.5 text-xs text-slate-500 hover:text-slate-200 font-sans font-extrabold cursor-pointer"
                    type="button"
                  >
                    ✖
                  </button>
                )}
              </div>

              <div className="flex-grow overflow-y-auto pr-1 space-y-2 flex flex-col justify-start">
                {displayedAssetsList.length === 0 ? (
                  <div className="flex-grow flex flex-col items-center justify-center text-center p-4 border border-dashed border-slate-800 rounded-2xl bg-slate-900/10 my-1 min-h-[300px]">
                    <div className="p-2 bg-slate-900 rounded-full border border-dashed border-slate-850 text-cyan-400 animate-pulse mb-3">
                      <SlidersHorizontal size={20} />
                    </div>
                    <div className="text-xs font-black text-slate-300 uppercase tracking-wider">
                      Sin extremos en este momento
                    </div>
                    <p className="text-[10.5px] font-mono leading-relaxed text-slate-500 max-w-[220px] mt-2 text-center">
                      Monitoreando {scannedCount}/{contractsList.length} monedas... Buscando RSI extremos (≤ {rsiOS} o ≥ {rsiOB}) en tempo de {timeframe}...
                    </p>
                    <p className="text-[9px] font-mono text-cyan-500/70 mt-3 uppercase tracking-widest font-bold">
                      Bocinas Sintética lista
                    </p>
                  </div>
                ) : (
                  displayedAssetsList.map((asset) => {
                    const isActive = asset.symbol === activeSymbol;
                    let rsiColorTextClass = "text-cyan-400 font-extrabold";
                    if (asset.rsi >= rsiOB) {
                      rsiColorTextClass = "text-rose-400 font-black";
                    } else if (asset.rsi <= rsiOS) {
                      rsiColorTextClass = "text-emerald-400 font-black";
                    }

                    let cardBorderClass = "border-slate-900 hover:border-slate-800 hover:bg-slate-900/40";
                    let badgeLabel = "NEUTRAL";

                    if (asset.rsi >= rsiOB) {
                      cardBorderClass = isActive
                        ? "border-rose-500 bg-rose-955/20 shadow-[0_0_15px_rgba(244,63,94,0.2)]"
                        : "border-rose-950/80 bg-rose-950/5 hover:border-rose-800 hover:bg-rose-950/10";
                      badgeLabel = asset.rsi >= 90 ? "SNIPER SHORT" : "SHORT";
                    } else if (asset.rsi <= rsiOS) {
                      cardBorderClass = isActive
                        ? "border-emerald-500 bg-emerald-955/20 shadow-[0_0_15px_rgba(16,185,129,0.2)]"
                        : "border-emerald-955/80 bg-emerald-955/5 hover:border-emerald-800 hover:bg-emerald-955/10";
                      badgeLabel = asset.rsi <= 10 ? "SNIPER LONG" : "LONG";
                    } else if (isActive) {
                      cardBorderClass = "border-cyan-500 bg-cyan-950/15 shadow-[0_0_12px_rgba(6,182,212,0.15)]";
                    }

                    return (
                      <button
                        key={asset.symbol}
                        id={`ranking-card-${asset.symbol}`}
                        onClick={() => handleTickerCardClick(asset.symbol)}
                        className={`w-full flex items-center justify-between p-2.5 rounded-xl border text-left transition-all duration-300 relative overflow-hidden backdrop-blur-xs cursor-pointer ${cardBorderClass}`}
                        type="button"
                      >
                        {isActive && <span className="absolute left-0 inset-y-0 w-[4px] bg-cyan-400" />}
                        <div className="flex flex-col gap-0.5">
                          <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="font-extrabold text-xs text-white tracking-wide">
                              {asset.symbol.replace("USDT", "")}
                            </span>
                            {badgeLabel !== "NEUTRAL" && (
                              <span
                                className={`text-[8.5px] font-mono px-1 py-0.2 rounded font-black tracking-tight uppercase ${
                                  badgeLabel.includes("SHORT")
                                    ? "bg-rose-950 border border-rose-850 text-rose-400"
                                    : "bg-emerald-950 border border-emerald-850 text-emerald-400"
                                }`}
                              >
                                {badgeLabel}
                              </span>
                            )}
                          </div>
                          <span className="text-[10px] font-mono text-slate-500 font-medium">
                            $
                            {asset.price.toLocaleString(undefined, {
                              minimumFractionDigits: asset.price < 1 ? 4 : 2,
                              maximumFractionDigits: asset.price < 1 ? 6 : 2,
                            })}
                          </span>
                        </div>

                        <div className="flex items-center gap-2">
                          <div className="flex flex-col items-end gap-0.5">
                            <div className="text-[10px] font-mono font-medium">
                              RSI{" "}
                              <span className={rsiColorTextClass}>
                                {typeof asset.rsi === "number" ? asset.rsi.toFixed(1) : "50.0"}
                              </span>
                            </div>
                            <span
                              className={`text-[10px] font-mono font-bold flex items-center gap-0.5 ${
                                asset.change24h >= 0 ? "text-emerald-400" : "text-rose-400"
                              }`}
                            >
                              {asset.change24h >= 0 ? "+" : ""}
                              {asset.change24h.toFixed(1)}%
                            </span>
                          </div>

                          <div className="flex flex-col items-center justify-center bg-slate-900 border border-slate-800 rounded-lg w-10 h-10 shrink-0">
                            <span className="text-[14px] font-black text-amber-400 font-mono">
                              {asset.score}
                            </span>
                            <span className="text-[7px] text-slate-500 font-mono tracking-tighter font-extrabold leading-none animate-pulse">
                              SCORE
                            </span>
                          </div>
                        </div>
                      </button>
                    );
                  })
                )}
              </div>

              <div className="border-t border-slate-900 pt-3 mt-3 flex justify-between items-center text-[10px] font-mono text-slate-500 uppercase tracking-wide font-extrabold">
                <span>Frecuencia: ~{scanTickerCount} calculos/min</span>
                <span>Binance Live TLS</span>
              </div>
            </div>

            {/* Middle part: main chart widget */}
            <div className="xl:col-span-6 flex flex-col gap-4">
              <div className="flex-1 h-[490px] xl:h-[490px] bg-slate-950/80 border border-slate-800 rounded-2xl p-2 shadow-2xl overflow-hidden relative">
                <TradingViewWidget
                  symbol={activeSymbol}
                  timeframe={timeframe}
                  candles={activeCandles}
                  analysis={activeAnalysis || {
                    rsi: [],
                    ema50: [],
                    ema200: [],
                    supports: [],
                    resistances: [],
                    channelUpper: [],
                    channelLower: [],
                    marketStructure: [],
                    trendLine: [],
                    divergences: [],
                    currentScore: 0,
                    scoreBreakdown: { rsi: 0, divergence: 0, trend: 0, oi: 0, funding: 0, volume: 0, supRes: 0 },
                    signals: []
                  }}
                />
              </div>
            </div>

            {/* Right part: dynamic indicators consensus panel */}
            <div className="xl:col-span-3 bg-slate-950/90 border border-slate-800 rounded-2xl p-3 backdrop-blur-md flex flex-col h-[490px] xl:h-[490px] shadow-2xl overflow-y-auto">
              <div>
                <div className="flex items-center gap-2 border-b border-slate-950 pb-2 mb-2 font-mono">
                  <Layers className="text-cyan-400" size={15} />
                  <span className="text-xs font-extrabold text-white uppercase tracking-widest">
                    CONSENSO INSTITUCIONAL ({activeSymbol.replace("USDT", "")})
                  </span>
                </div>

                <div className="p-2.5 bg-slate-900/55 border border-slate-850 rounded-xl mb-2 text-center shadow-inner">
                  <span className="text-[9.5px] font-mono text-slate-500 uppercase tracking-widest block font-bold">
                    Consenso de Tendencia General
                  </span>
                  <div
                    className={`mt-1.5 py-1 border rounded-lg text-xs font-black font-mono text-center tracking-widest ${institutionalConsensus.color}`}
                  >
                    {institutionalConsensus.label}
                  </div>

                  {/* Timeframes grids */}
                  <div className="grid grid-cols-4 gap-1.5 mt-2.5 border-t border-slate-950/60 pt-2 font-mono">
                    {["5m", "15m", "1h", "4h"].map((tf) => {
                      const m = activeTfMetrics[tf];
                      return (
                        <div
                          key={tf}
                          className="flex flex-col gap-0.5 p-1 bg-slate-950/80 border border-slate-900 rounded-md"
                        >
                          <span className="text-[9px] text-slate-500 uppercase font-black">{tf}</span>
                          <span className="text-[11px] font-black text-slate-200">
                            {m ? m.rsi.toFixed(1) : "50.0"}
                          </span>
                          <span
                            className={`text-[7.5px] font-black py-0.2 px-0.1 rounded uppercase ${
                              m?.trend === "Alcista"
                                ? "text-emerald-400"
                                : m?.trend === "Bajista"
                                ? "text-rose-400"
                                : "text-slate-500"
                            }`}
                          >
                            {m ? (m.trend === "Alcista" ? "UP" : m.trend === "Bajista" ? "DOWN" : "NEUTRAL") : "..."}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Score distribution meter */}
                <div className="mb-2">
                  <div className="flex items-center justify-between mb-1.5">
                    <span className="text-[10px] font-mono text-slate-400 uppercase tracking-widest font-bold">
                      Distribución Score
                    </span>
                    <span className="text-[10px] font-mono text-amber-400 font-black">
                      {activeAnalysis ? activeAnalysis.currentScore : "0"}/100 PTS
                    </span>
                  </div>

                  <div className="space-y-1.5">
                    {[
                      { label: "RSI Extremo", score: activeAnalysis?.scoreBreakdown.rsi ?? 0, max: 25 },
                      { label: "Divergencia Activa", score: activeAnalysis?.scoreBreakdown.divergence ?? 0, max: 20 },
                      { label: "Tendencia EMA", score: activeAnalysis?.scoreBreakdown.trend ?? 0, max: 15 },
                      { label: "Open Interest", score: activeAnalysis?.scoreBreakdown.oi ?? 0, max: 10 },
                      { label: "Funding Rate", score: activeAnalysis?.scoreBreakdown.funding ?? 0, max: 10 },
                      { label: "Volumen Com.", score: activeAnalysis?.scoreBreakdown.volume ?? 0, max: 10 },
                      { label: "Soporte / Resist.", score: activeAnalysis?.scoreBreakdown.supRes ?? 0, max: 10 },
                    ].map((item) => (
                      <div key={item.label} className="text-[9.5px] font-mono flex flex-col gap-0.5">
                        <div className="flex justify-between items-baseline font-bold font-sans">
                          <span className="text-slate-403 uppercase tracking-wide">{item.label}</span>
                          <span className="text-slate-200 font-black font-mono">
                            {item.score}/{item.max}
                          </span>
                        </div>
                        <div className="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden border border-slate-850">
                          <div
                            className="bg-gradient-to-r from-cyan-400 to-cyan-500 h-full transition-all duration-500 shadow-[0_0_8px_rgba(6,182,212,0.5)]"
                            style={{ width: `${(item.score / item.max) * 100}%` }}
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Tactical Sniper Signal Box */}
                <div className="border-t border-slate-950 pt-3">
                  <div className="flex items-center gap-2 mb-2 font-mono">
                    <Zap className="text-yellow-405 shrink-0" size={14} />
                    <span className="text-xs font-mono text-yellow-400 uppercase tracking-widest font-bold">
                      SISTEMA SNIPER INTRAWAVE
                    </span>
                  </div>
                  {activeAnalysis &&
                  (activeAnalysis.rsi[activeAnalysis.rsi.length - 1] <= 10 ||
                    activeAnalysis.rsi[activeAnalysis.rsi.length - 1] >= 90) ? (
                    <div className="p-3 bg-yellow-950/20 border border-yellow-800/80 rounded-xl text-yellow-400 text-center font-mono text-xs font-black animate-pulse">
                      🎯 SNIPER DETECTADO: CONDICIÓN EXTREMA DE ENTRADA
                      <div className="text-[10px] text-slate-400 mt-1 uppercase font-semibold">
                        Involución de tendencia de máxima probabilidad alcista/bajista.
                      </div>
                    </div>
                  ) : (
                    <div className="p-3 bg-slate-900/35 border border-slate-850 rounded-xl text-slate-500 text-center font-mono text-xs font-extrabold uppercase">
                      Scanner Sniper en Standby • Evaluando RSI...
                    </div>
                  )}
                </div>
              </div>

              <div className="border-t border-slate-900 pt-4 mt-4 text-[11px] font-mono space-y-2 uppercase tracking-wide font-extrabold">
                <div className="flex justify-between items-baseline">
                  <span className="text-slate-500">TASA FINANCIERA (FUNDING):</span>
                  <span
                    className={`font-black ${
                      (activeTickerData?.fundingRate || 0) >= 0.0003 ? "text-rose-455" : "text-emerald-450"
                    }`}
                  >
                    {((activeTickerData?.fundingRate || 0.0001) * 100).toFixed(4)}%
                  </span>
                </div>
                <div className="flex justify-between items-baseline">
                  <span className="text-slate-500">OPEN INTEREST ESTIMADO:</span>
                  <span className="text-slate-200 font-extrabold">
                    $
                    {((activeTickerData?.openInterest || activeTickerPrice * 1000) || 5000000).toLocaleString(
                      undefined,
                      { maximumFractionDigits: 0 }
                    )}{" "}
                    USDT
                  </span>
                </div>
                <div className="flex justify-between items-baseline">
                  <span className="text-slate-500">SOPORTES DETECTADOS:</span>
                  <span className="text-emerald-450 font-black truncate max-w-[140px] tracking-tighter">
                    {activeAnalysis && activeAnalysis.supports.length > 0
                      ? activeAnalysis.supports.map((s) => s.toFixed(2)).join(" | ")
                      : "..."}
                  </span>
                </div>
                <div className="flex justify-between items-baseline">
                  <span className="text-slate-550">RESISTENCIAS DETECTADAS:</span>
                  <span className="text-rose-455 font-black truncate max-w-[140px] tracking-tighter">
                    {activeAnalysis && activeAnalysis.resistances.length > 0
                      ? activeAnalysis.resistances.map((r) => r.toFixed(2)).join(" | ")
                      : "..."}
                  </span>
                </div>
              </div>
            </div>
          </main>

          <section className="max-w-[1550px] w-full mx-auto px-4 pb-8">
            <AlertAuditorPanel
              alerts={alerts}
              onClear={() => setAlerts([])}
              onSelectSymbol={(sym) => setActiveSymbol(sym)}
              activeSymbol={activeSymbol}
              activeRsi={
                activeAnalysis
                  ? activeAnalysis.rsi[activeAnalysis.rsi.length - 1]
                  : monitoredAssets[activeSymbol]?.rsi ?? 50
              }
            />
          </section>

          <footer className="border-t border-slate-900 bg-slate-950 py-5 text-center text-xs font-mono text-slate-500 font-bold uppercase tracking-widest mt-auto">
            <div className="max-w-[1550px] mx-auto flex flex-col sm:flex-row justify-between items-center px-4 gap-2">
              <span>© CALCULADORA CLIENTE 100% EXCLUSIVE • CONTROLES QUANT ACTIVADOS</span>
              <span className="text-cyan-800">CONSTRUCCIÓN COMPLETA DE ALINEACIONES MULTI-TIMEFRAME</span>
            </div>
          </footer>
        </div>
      );
    }

    // Mount to root
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);

  </script>
</body>
</html>
