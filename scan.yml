name: Bitget RSI Scanner

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos
  workflow_dispatch:          # también manual desde GitHub

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch

      - name: Run scanner
        run: node scan.js

      - name: Commit signals.json
        run: |
          git config user.name "nexus-bot"
          git config user.email "bot@nexus.com"
          git add signals.json
          git diff --staged --quiet || git commit -m "scan $(date -u '+%H:%M:%S UTC')"
          git push
